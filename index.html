<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pooka</title>
<style>
  :root {
    --bg: #eef1f4;
    --ink: #1c2330;
    --muted: #5d6878;
    --accent: #5b4b8a;
    --frame: #dde2e8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a24;
      --ink: #e6eaf0;
      --muted: #9aa5b6;
      --accent: #b3a4e6;
      --frame: #232c3b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Top bar with a dropdown menu */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--frame);
    padding: calc(env(safe-area-inset-top, 0px) + 0.6rem) 1.25rem 0.6rem;
  }
  .topbar-inner {
    max-width: 60rem; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { color: var(--accent); text-decoration: none; font-size: 1.25rem; }
  .menu { position: relative; }
  .menu summary {
    list-style: none; cursor: pointer;
    padding: 0.4rem 0.9rem; border: 1px solid var(--frame); border-radius: 999px;
    color: var(--ink);
  }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary:focus-visible, .menu a:focus-visible, .brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .menu ul {
    position: absolute; right: 0; top: calc(100% + 0.4rem);
    margin: 0; padding: 0.4rem; list-style: none; min-width: 10rem;
    background: var(--bg); border: 1px solid var(--frame); border-radius: 10px;
  }
  .menu li a {
    display: block; padding: 0.6rem 0.8rem; border-radius: 6px;
    color: var(--ink); text-decoration: none;
  }
  .menu li a:hover { background: var(--frame); color: var(--accent); }

  header { padding: 3rem 1.25rem 1.5rem; max-width: 60rem; margin: 0 auto; }
  h1 {
    font-size: clamp(3.5rem, 18vw, 8rem);
    line-height: 0.9; margin: 0; font-weight: 400;
    letter-spacing: -0.03em; color: var(--accent);
  }
  header p { margin: 1rem 0 0; color: var(--muted); font-size: 1.1rem; max-width: 30rem; }
  main { max-width: 60rem; margin: 0 auto; padding: 0 1.25rem 2rem; }

  /* Photo grid with a hover zoom */
  .grid { columns: 2 9rem; column-gap: 0.75rem; }
  .grid button {
    display: block; width: 100%; margin: 0 0 0.75rem; padding: 0;
    border: 0; background: var(--frame); border-radius: 6px;
    overflow: hidden; cursor: zoom-in; break-inside: avoid;
  }
  .grid img { display: block; width: 100%; height: auto; transition: transform 0.35s ease; }
  @media (hover: hover) {
    .grid button:hover img { transform: scale(1.06); }
  }
  .grid button:active img { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .grid img { transition: none; }
    html { scroll-behavior: auto; }
  }
  .grid button:focus-visible, dialog button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #about { max-width: 60rem; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
  #about h2 { font-weight: 400; font-size: 2rem; margin: 0 0 0.5rem; color: var(--accent); }
  #about p { max-width: 36rem; color: var(--muted); font-size: 1.1rem; margin: 0; }

  dialog {
    border: 0; padding: 0; background: transparent;
    max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh;
  }
  dialog::backdrop { background: rgba(10, 14, 20, 0.92); }
  dialog button {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent; padding: 1rem; cursor: zoom-out;
  }
  dialog img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: auto; }
  footer { text-align: center; color: var(--muted); padding: 0 1.25rem 2rem; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">Pooka</a>
    <details class="menu">
      <summary>Menu</summary>
      <ul>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </details>
  </div>
</div>

<header id="top">
  <h1>Pooka</h1>
  <p>Mr. Boom Booms.</p>
</header>

<main id="gallery">
  <div class="grid" id="grid"></div>
</main>

<section id="about">
  <h2>About Pooka</h2>
  <p>Write a few words about Pooka here. Edit this line in index.html.</p>
</section>

<footer>Tap a photo to enlarge it.</footer>

<dialog id="viewer"><button type="button" aria-label="Close photo"><img id="big" alt=""></button></dialog>

<script>
  // Add your photo file names here. Upload the photos to the same folder as this file.
  const photos = [
  
    "pooka6.jpg", "pooka7.jpg", "pooka8.jpg", "pooka9.jpg", "pooka10.jpg"
  ];

  const grid = document.getElementById("grid");
  const viewer = document.getElementById("viewer");
  const big = document.getElementById("big");
  const menu = document.querySelector(".menu");

  photos.forEach((file, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", "Open photo " + (i + 1));
    const img = document.createElement("img");
    img.src = file;
    img.alt = "Pooka, photo " + (i + 1);
    img.loading = "lazy";
    img.onerror = () => btn.remove();
    btn.appendChild(img);
    btn.addEventListener("click", () => {
      big.src = file;
      big.alt = img.alt;
      viewer.showModal();
    });
    grid.appendChild(btn);
  });

  viewer.addEventListener("click", () => viewer.close());

  // Close the dropdown after picking a link
  menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => menu.removeAttribute("open")));
</script>
</body>
</html>

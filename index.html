<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pooka</title>
<style>
  :root {
    --bg: #eef1f4;
    --ink: #1c2330;
    --muted: #5d6878;
    --accent: #5b4b8a;
    --frame: #dde2e8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a24;
      --ink: #e6eaf0;
      --muted: #9aa5b6;
      --accent: #b3a4e6;
      --frame: #232c3b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  header { padding: 3rem 1.25rem 1.5rem; max-width: 60rem; margin: 0 auto; }
  h1 {
    font-size: clamp(3.5rem, 18vw, 8rem);
    line-height: 0.9;
    margin: 0;
    font-weight: 400;
    letter-spacing: -0.03em;
    color: var(--accent);
  }
  header p { margin: 1rem 0 0; color: var(--muted); font-size: 1.1rem; max-width: 30rem; }
  main { max-width: 60rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
  .grid { columns: 2 9rem; column-gap: 0.75rem; }
  .grid button {
    display: block; width: 100%; margin: 0 0 0.75rem; padding: 0;
    border: 0; background: var(--frame); border-radius: 6px;
    overflow: hidden; cursor: zoom-in; break-inside: avoid;
  }
  .grid img { display: block; width: 100%; height: auto; }
  .grid button:focus-visible, dialog button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  dialog {
    border: 0; padding: 0; background: transparent;
    max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh;
  }
  dialog::backdrop { background: rgba(10, 14, 20, 0.92); }
  dialog button {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent; padding: 1rem; cursor: zoom-out;
  }
  dialog img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: auto; }
  footer { text-align: center; color: var(--muted); padding: 0 1.25rem 2rem; font-size: 0.95rem; }
</style>
</head>
<body>
<header>
  <h1>Pooka</h1>
  <p>Mr. Boom Booms.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Tap a photo to enlarge it.</footer>

<dialog id="viewer"><button type="button" aria-label="Close photo"><img id="big" alt=""></button></dialog>

<script>
  // Add your photo file names here. Upload the photos to the same folder as this file.
  const photos = [
    "pooka6.jpg",
    "pooka7.jpg",
    "pooka8.jpg",
    "pooka9.jpg",
    "pooka10.jpg"
  ];

  const grid = document.getElementById("grid");
  const viewer = document.getElementById("viewer");
  const big = document.getElementById("big");

  photos.forEach((file, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", "Open photo " + (i + 1));
    const img = document.createElement("img");
    img.src = file;
    img.alt = "Pooka, photo " + (i + 1);
    img.loading = "lazy";
    img.onerror = () => btn.remove();
    btn.appendChild(img);
    btn.addEventListener("click", () => {
      big.src = file;
      big.alt = img.alt;
      viewer.showModal();
    });
    grid.appendChild(btn);
  });

  viewer.addEventListener("click", () => viewer.close());
</script>
</body>
</html>
